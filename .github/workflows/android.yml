name: Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build HR and Employee debug APKs
        run: gradle -p native/android :app:assembleAdminDebug :app:assembleEmployeeDebug
      - name: Verify Android permissions and variants
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT"
          for APK in native/android/app/build/outputs/apk/{admin,employee}/debug/*.apk; do
            "$AAPT" dump permissions "$APK" | tee permissions.txt
            grep -Fq 'android.permission.ACCESS_FINE_LOCATION' permissions.txt
            grep -Fq 'android.permission.ACCESS_COARSE_LOCATION' permissions.txt
            grep -Fq 'android.permission.CAMERA' permissions.txt
            grep -Fq 'android.permission.USE_BIOMETRIC' permissions.txt
            if grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' permissions.txt; then exit 1; fi
            "$AAPT" dump badging "$APK" > badging.txt
            head -1 badging.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TCW-HR-Android
          path: native/android/app/build/outputs/apk/admin/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TCW-Employee-Android
          path: native/android/app/build/outputs/apk/employee/debug/*.apk
