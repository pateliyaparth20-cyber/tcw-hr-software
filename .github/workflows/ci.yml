name: TCW HR Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-design-previews
          path: |
            test-results/reports-*.png
            test-results/organization-*.png
            test-results/update-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  payroll-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tcw_payroll_test
          POSTGRES_USER: payroll_test
          POSTGRES_PASSWORD: synthetic-local-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payroll_test -d tcw_payroll_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payroll_test:synthetic-local-test-password@127.0.0.1:5432/tcw_payroll_test
      PAYROLL_TEST_DATABASE_URL: postgresql://payroll_test:synthetic-local-test-password@127.0.0.1:5432/tcw_payroll_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:concurrency
      - name: Verify backup restoration on a separate test database
        run: bash scripts/test-restore.sh
        env:
          RESTORE_TEST_CONTAINER: ${{ job.services.postgres.id }}
