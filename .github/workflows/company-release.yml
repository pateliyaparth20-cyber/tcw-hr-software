name: Manual Software Update
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Publish Verified Software Candidate]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: company-production-release
  cancel-in-progress: true
jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Watch for requested and verified releases
        uses: actions/github-script@v7
        with:
          script: |
            const {watchRequestedReleases} = require('./scripts/manual-release.cjs');
            await watchRequestedReleases({fetch,github,context,core});
