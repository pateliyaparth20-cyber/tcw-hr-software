name: Approved Company Release
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: company-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advance production only for an approved and verified release
        uses: actions/github-script@v7
        with:
          script: |
            const response = await fetch('https://hr.techcyberwarrior.in/api/releases/deployable', {signal: AbortSignal.timeout(15000), cache: 'no-store'});
            if (!response.ok) { core.info('Release control unavailable; keeping production unchanged.'); return; }
            const {version} = await response.json();
            if (!version) { core.info('No fully approved release.'); return; }
            if (!/^[a-f0-9]{40}$/.test(version)) throw new Error('Invalid release SHA');
            const {owner, repo} = context.repo;
            const current = await github.rest.git.getRef({owner, repo, ref: 'heads/release/production'});
            if (current.data.object.sha === version) { core.info('Release already queued.'); return; }
            const compare = await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: `${current.data.object.sha}...${version}`});
            if (compare.data.status !== 'ahead') throw new Error('Approved release is not a forward production update');
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'ci.yml', head_sha: version, branch: 'main', event: 'push', per_page: 10});
            const verification = runs.data.workflow_runs[0];
            if (!verification || verification.status !== 'completed' || verification.conclusion !== 'success') { core.info('Exact release verification has not passed; keeping production unchanged.'); return; }
            await github.rest.git.updateRef({owner, repo, ref: 'heads/release/production', sha: version, force: false});
            core.info(`Queued approved production release ${version.slice(0,12)}.`);
