name: Publish Verified Software Candidate
on:
  workflow_run:
    workflows: [TCW HR Verification]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: verified-software-candidate
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the verified version without advancing production
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const version = context.payload.workflow_run.head_sha;
            const main = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            if (main.data.object.sha !== version) { core.info('A newer main commit is waiting for verification.'); return; }
            const branch = 'release/catalog';
            try { await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`}); }
            catch (error) { if (error.status !== 404) throw error; await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: version}); }
            const commit = await github.rest.repos.getCommit({owner, repo, ref: version});
            const candidate = {version, title: commit.data.commit.message.split('\n')[0].slice(0,180), publishedAt: commit.data.commit.committer.date};
            const path = '.release/latest.json';
            let sha;
            try { const previous = await github.rest.repos.getContent({owner, repo, path, ref: branch}); sha = previous.data.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({owner, repo, branch, path, sha, message: 'Publish verified software candidate', content: Buffer.from(JSON.stringify(candidate)+'\n').toString('base64')});
            core.info(`Published verified candidate ${version.slice(0,12)}. Production still requires a manual Update.`);
