name: peopleos
x-app: &app
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    REDIS_URL: redis://redis:6379
    API_INTERNAL_URL: http://api:4000
    SMTP_HOST: mailpit
    S3_ENDPOINT: http://minio:9000
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 2; done; mc mb --ignore-existing local/$$S3_BUCKET"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    <<: *app
    profiles: ["full"]
    restart: "no"
    command: sh -c "npm run db:migrate && npm run db:seed"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    profiles: ["full"]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    <<: *app
    profiles: ["full"]
    command: npm run start --workspace=@peopleos/web
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  super-admin:
    <<: *app
    profiles: ["full"]
    command: npm run start --workspace=@peopleos/super-admin
    ports: ["127.0.0.1:3001:3001"]
    depends_on: [api]
  worker:
    <<: *app
    profiles: ["full"]
    command: npm run start:worker
    depends_on: [api, redis, mailpit]
volumes:
  pg-data:
  redis-data:
  objects:
