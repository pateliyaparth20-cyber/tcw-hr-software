# Example TLS edge config. Replace names and certificate paths before use.
limit_req_zone $binary_remote_addr zone=peopleos:10m rate=10r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream peopleos_web { server web:3000; }
upstream peopleos_admin { server super-admin:3001; }
upstream peopleos_api { server api:4000; }
server {
  listen 443 ssl;
  server_name hr.example.com;
  ssl_certificate /etc/letsencrypt/live/hr.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hr.example.com/privkey.pem;
  client_max_body_size 11m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location /api/ { limit_req zone=peopleos burst=30 nodelay; proxy_pass http://peopleos_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /iclock/ { limit_req zone=peopleos burst=60 nodelay; proxy_pass http://peopleos_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /socket.io/ { proxy_pass http://peopleos_api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  location / { proxy_pass http://peopleos_web; proxy_set_header Host $host; }
}
server {
  listen 443 ssl;
  server_name admin.example.com;
  ssl_certificate /etc/letsencrypt/live/admin.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
  client_max_body_size 11m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location /api/ { limit_req zone=peopleos burst=30 nodelay; proxy_pass http://peopleos_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /iclock/ { limit_req zone=peopleos burst=60 nodelay; proxy_pass http://peopleos_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /socket.io/ { proxy_pass http://peopleos_api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  location / { proxy_pass http://peopleos_admin; proxy_set_header Host $host; }
}
