plugins { id 'com.android.application' }

def hrUrl = project.findProperty('TCW_APP_URL') ?: 'https://hr.techcyberwarrior.in'
def employeeUrl = project.findProperty('TCW_EMPLOYEE_APP_URL') ?: 'https://employee.techcyberwarrior.in'
def signingVariables = ['TCW_KEYSTORE_PATH', 'TCW_KEYSTORE_PASSWORD', 'TCW_KEY_ALIAS', 'TCW_KEY_PASSWORD']
def releaseSigningReady = signingVariables.every { System.getenv(it)?.trim() }

android {
    namespace 'com.tcw.hrsoftware'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tcw.hrsoftware'
        minSdk 26
        targetSdk 36
        versionCode 135
        versionName '1.3.5'
        manifestPlaceholders = [usesCleartextTraffic: 'true', appLabel: 'TCW HR Software']
    }

    flavorDimensions += 'portal'
    productFlavors {
        admin {
            dimension 'portal'
            buildConfigField 'String', 'TCW_APP_URL', '"' + hrUrl + '"'
            buildConfigField 'String', 'TCW_APP_MODE', '"ADMIN"'
            manifestPlaceholders = [appLabel: 'TCW HR Software']
        }
        employee {
            dimension 'portal'
            applicationIdSuffix '.employee'
            versionNameSuffix '-employee'
            buildConfigField 'String', 'TCW_APP_URL', '"' + employeeUrl + '"'
            buildConfigField 'String', 'TCW_APP_MODE', '"EMPLOYEE"'
            manifestPlaceholders = [appLabel: 'TCW Employee']
        }
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(System.getenv('TCW_KEYSTORE_PATH'))
                storePassword System.getenv('TCW_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TCW_KEY_ALIAS')
                keyPassword System.getenv('TCW_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders.usesCleartextTraffic = 'true'
        }
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            manifestPlaceholders.usesCleartextTraffic = 'false'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def prefix = variant.flavorName == 'employee' ? 'TCW-Employee' : 'TCW-HR'
            outputFileName = "${prefix}-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def publishingTasks = ['assembleAdminRelease', 'assembleEmployeeRelease', 'bundleAdminRelease', 'bundleEmployeeRelease']
    if (graph.allTasks.any { it.project == project && publishingTasks.contains(it.name) }) {
        if (!releaseSigningReady) {
            throw new GradleException('Release signing requires: ' + signingVariables.join(', '))
        }
        [hrUrl, employeeUrl].each { portalUrl ->
            def uri = new URI(portalUrl.toString())
            if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment || (uri.path && uri.path != '/')) {
                throw new GradleException('Release portal URLs must be HTTPS origins without credentials, paths, queries, or fragments.')
            }
        }
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
