plugins { id 'com.android.application' }

android {
    namespace 'com.tcw.hrsoftware'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tcw.hrsoftware'
        minSdk 26
        targetSdk 35
        versionCode 130
        versionName '1.3.0'
        manifestPlaceholders = [usesCleartextTraffic: 'true']
        def appUrl = project.findProperty('TCW_APP_URL') ?: 'https://YOUR-HR-DOMAIN.example'
        buildConfigField 'String', 'TCW_APP_URL', '"' + appUrl + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            manifestPlaceholders.usesCleartextTraffic = 'true'
        }
        release {
            manifestPlaceholders.usesCleartextTraffic = 'false'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
