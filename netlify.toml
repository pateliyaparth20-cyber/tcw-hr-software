# API project. Portal projects use the corresponding config under deploy/netlify/.
[build]
  command = "node scripts/build-netlify.mjs api"
  publish = "deploy/netlify/public"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[server]
  includedFiles = ["dist/**", "node_modules/.prisma/client/**"]

[server.scale]
  min = 0
  max = 1
