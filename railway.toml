[build]
builder = "NIXPACKS"
buildCommand = "npm run typecheck && npm test && npm run test:integration && npm run db:generate && npm run build"

[deploy]
startCommand = "npm run railway:boot"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
