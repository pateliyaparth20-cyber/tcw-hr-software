# Full HR SOFTWARE workspace deployment. Worker costs require review before Apply.
# Free web services sleep and free PostgreSQL is temporary; see deploy/providers/RENDER.md.
services:
- type: keyvalue
  name: tcw-hr-redis
  region: singapore
  ipAllowList: []
  plan: free
  maxmemoryPolicy: noeviction
- type: web
  name: tcw-hr-api
  region: singapore
  runtime: node
  buildCommand: npm ci --include=dev && npm run build:backend
  startCommand: npm run db:migrate && npm run db:seed && npm run start:api
  healthCheckPath: /api/health
  envVars:
  - key: NODE_VERSION
    value: 22.12.0
  - key: NODE_ENV
    value: production
  - key: COOKIE_SECURE
    value: 'true'
  - key: PUBLIC_SIGNUP_ENABLED
    value: 'true'
  - key: TRIAL_DAYS
    value: '3'
  - key: AUTO_SUSPEND_OVERDUE
    value: 'true'
  - key: OVERDUE_GRACE_DAYS
    value: '3'
  - key: SEED_DEMO
    value: 'false'
  - key: WEB_URL
    sync: false
  - key: ADMIN_URL
    sync: false
  - key: APP_ORIGINS
    sync: false
  - key: DATABASE_URL
    fromDatabase:
      name: tcw-hr-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      name: tcw-hr-redis
      type: keyvalue
      property: connectionString
  - key: CONFIG_ENCRYPTION_KEY
    sync: false
  - key: ADMIN_EMAIL
    sync: false
  - key: ADMIN_PASSWORD
    sync: false
  - key: SMTP_HOST
    sync: false
  - key: SMTP_PORT
    value: '587'
  - key: SMTP_SECURE
    value: 'false'
  - key: SMTP_USER
    sync: false
  - key: SMTP_PASSWORD
    sync: false
  - key: SMTP_FROM
    sync: false
  - key: S3_ENDPOINT
    sync: false
  - key: S3_REGION
    value: ap-south-1
  - key: S3_BUCKET
    sync: false
  - key: S3_ACCESS_KEY
    sync: false
  - key: S3_SECRET_KEY
    sync: false
  - key: PAYMENT_INSTRUCTIONS
    value: Contact TCW HR Software billing to activate or renew your subscription.
  - key: BIOMAX_AUTO_MAP_EMPLOYEE_CODE
    value: 'true'
  - key: BIOMAX_ENFORCE_SOURCE_IP
    value: 'false'
  plan: free
  repo: https://github.com/pateliyaparth20-cyber/tcw-hr-software
  branch: main
  autoDeployTrigger: checksPass
- type: worker
  name: tcw-hr-worker
  region: singapore
  runtime: node
  buildCommand: npm ci --include=dev && npm run build:backend
  startCommand: npm run db:migrate && npm run start:worker
  envVars:
  - key: NODE_VERSION
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: NODE_VERSION
  - key: NODE_ENV
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: NODE_ENV
  - key: DATABASE_URL
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: DATABASE_URL
  - key: REDIS_URL
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: REDIS_URL
  - key: CONFIG_ENCRYPTION_KEY
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: CONFIG_ENCRYPTION_KEY
  - key: WEB_URL
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: WEB_URL
  - key: SMTP_HOST
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: SMTP_HOST
  - key: SMTP_PORT
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: SMTP_PORT
  - key: SMTP_SECURE
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: SMTP_SECURE
  - key: SMTP_USER
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: SMTP_USER
  - key: SMTP_PASSWORD
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: SMTP_PASSWORD
  - key: SMTP_FROM
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: SMTP_FROM
  - key: AUTO_SUSPEND_OVERDUE
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: AUTO_SUSPEND_OVERDUE
  - key: OVERDUE_GRACE_DAYS
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: OVERDUE_GRACE_DAYS
  plan: starter
  repo: https://github.com/pateliyaparth20-cyber/tcw-hr-software
  branch: main
  autoDeployTrigger: checksPass
- type: web
  name: tcw-hr-portal
  runtime: node
  region: singapore
  plan: free
  repo: https://github.com/pateliyaparth20-cyber/tcw-hr-software
  branch: main
  autoDeployTrigger: checksPass
  buildCommand: npm ci --include=dev && node scripts/prepare-face-assets.mjs && npm
    run build --workspace=@peopleos/web
  startCommand: node node_modules/next/dist/bin/next start apps/web -H 0.0.0.0 -p
    $PORT
  healthCheckPath: /login
  envVars:
  - key: NODE_VERSION
    value: 22.12.0
  - key: NODE_ENV
    value: production
  - key: NEXT_TELEMETRY_DISABLED
    value: '1'
  - key: API_INTERNAL_URL
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: RENDER_EXTERNAL_URL
- type: web
  name: tcw-employee-portal
  runtime: node
  region: singapore
  plan: free
  repo: https://github.com/pateliyaparth20-cyber/tcw-hr-software
  branch: main
  autoDeployTrigger: checksPass
  buildCommand: npm ci --include=dev && node scripts/prepare-face-assets.mjs && npm
    run build --workspace=@peopleos/web
  startCommand: node node_modules/next/dist/bin/next start apps/web -H 0.0.0.0 -p
    $PORT
  healthCheckPath: /login
  envVars:
  - key: NODE_VERSION
    value: 22.12.0
  - key: NODE_ENV
    value: production
  - key: NEXT_TELEMETRY_DISABLED
    value: '1'
  - key: API_INTERNAL_URL
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: RENDER_EXTERNAL_URL
- type: web
  name: tcw-super-admin
  runtime: node
  region: singapore
  plan: free
  repo: https://github.com/pateliyaparth20-cyber/tcw-hr-software
  branch: main
  autoDeployTrigger: checksPass
  buildCommand: npm ci --include=dev && node scripts/prepare-face-assets.mjs && npm
    run build --workspace=@peopleos/super-admin
  startCommand: node node_modules/next/dist/bin/next start apps/super-admin -H 0.0.0.0
    -p $PORT
  healthCheckPath: /login
  envVars:
  - key: NODE_VERSION
    value: 22.12.0
  - key: NODE_ENV
    value: production
  - key: NEXT_TELEMETRY_DISABLED
    value: '1'
  - key: API_INTERNAL_URL
    fromService:
      name: tcw-hr-api
      type: web
      envVarKey: RENDER_EXTERNAL_URL
databases:
- name: tcw-hr-db
  region: singapore
  databaseName: tcw_hr
  user: tcw_hr_app
  postgresMajorVersion: '17'
  ipAllowList: []
  plan: free
